version: '3.8'

services:
  media-ripper:
    build: .
    container_name: media-ripper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Optional: mount cookies.txt if you want to bypass YouTube datacenter bot checks
      - ./cookies.txt:/app/cookies.txt:ro
